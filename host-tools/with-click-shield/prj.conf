CONFIG_SPI=y
CONFIG_GPIO=y

# Bridging received 10BASE-T1S frames out over CAN. Harmless when can.overlay
# is not applied: main.c compiles the bridge out if the can1 node is disabled.
CONFIG_CAN=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Not needed to see link/carrier status, but harmless and useful for
# poking at the interface manually over the console (net iface, net stats).
CONFIG_NET_SHELL=y

# Note when reading rx errors: every "OA RX: Data chunk not valid, skip!" bumps
# the rx error counter. The OA TC6 spec makes the driver read a data chunk on
# every IRQ_N assertion (that is the only way to deassert it), so interrupts
# that were not about pending RX data come back with the footer's DV bit clear
# and are counted as errors. On a healthy link those are expected.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y

# Capture every frame on the segment, not just those addressed to our MAC.
# The LAN865x driver advertises ETHERNET_PROMISC_MODE and implements it by
# setting CAF in the MAC's NCFGR register.
CONFIG_NET_PROMISCUOUS_MODE=n

# Raw AF_PACKET socket, so main.c can see EtherTypes the IP stack has no
# handler for (0x88b5 test traffic, for instance). Without this such frames are
# dropped at L2 and never reach the application.
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_NET_CONTEXT_RCVTIMEO=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_NET_LOG=y
# DHCPv4 depends on NET_IPV4 - without it the DHCPV4 symbol is silently dropped
# ("assigned the value 'y' but got the value 'n'"). The stack also does not
# start DHCP by itself; main.c calls net_dhcpv4_start().
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# Verbose logging for the LAN865x SPI/PHY bring-up path specifically.
CONFIG_ETHERNET_LOG_LEVEL_DBG=n
CONFIG_PHY_LOG_LEVEL_DBG=y
CONFIG_SPI_LOG_LEVEL_DBG=n
