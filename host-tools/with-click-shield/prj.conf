# Enable Networking Stack
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y

# Enable Drivers
CONFIG_SPI=y
CONFIG_ETH_LAN865X=y

# Enable CAN driver support
CONFIG_CAN=y

# Set Static MAC Address (Avoids reading I2C EEPROM)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.100"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"


# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
CONFIG_SHELL=y

CONFIG_ETH_STM32_HAL=n